[project]
name = "jev-chess"
version = "0.1.0"
description = "Jev (White) vs Stockfish (Black) step-through chess bot"
requires-python = ">=3.10"
dependencies = [
  "chess>=1.11",
  "pygame>=2.6.1",
  "python-dotenv>=1.2.3",
  "typesafe-sdk>=0.1",
]

[project.scripts]
jev-chess = "jev_chess.cli:main"
jev-chess-gui = "jev_chess.ui_pygame:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_chess"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
